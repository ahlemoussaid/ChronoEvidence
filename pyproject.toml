[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chrono-evidence"
version = "0.2.0"
description = "ChronoEvidence: Adaptive Claim-Level Evidence Coverage for Temporal Multi-Hop Retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Ahlem Oussaid (Mohammed Ousaid Ahlem)"}
]
dependencies = [
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "pandas>=2.0.0",
  "scikit-learn>=1.4.0",
  "matplotlib>=3.6.0",
  "networkx>=3.2.0",
  "pydantic>=2.0.0",
  "torch>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
